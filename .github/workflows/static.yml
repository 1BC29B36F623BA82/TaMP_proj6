# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["shsp", "docs"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build:
     environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
     runs-on: ubuntu-latest
     steps:
      - name: Checkout config (docs branch)
        uses: actions/checkout@v5
        with:
          path: ./docs

      - name: Checkout source code (shsp branch)
        uses: actions/checkout@v5
        with:
          ref: shsp
          path: ./TaMP_proj6-shsp

      # Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt update
          sudo apt install -y doxygen
          doxygen --version
      - name: Install Graphviz
        run: sudo apt install -y graphviz
        
      - name: Configure Doxyfile
        run: |
           cd ./docs
           # Check if the INPUT line exists in Doxyfile
           if grep -q "^INPUT\s*=" Doxyfile; then
              # If it exists, replace it with "INPUT = ../TaMP_proj6-main"
              sed -i 's|^INPUT\s*=.*|INPUT = ../TaMP_proj6-main|' Doxyfile
           else
              # If not, append the line to the file
              echo "INPUT = ../TaMP_proj6-main" >> Doxyfile
           fi

           # Similarly for RECURSIVE
           if grep -q "^RECURSIVE\s*=" Doxyfile; then
              sed -i 's|^RECURSIVE\s*=.*|RECURSIVE = YES|' Doxyfile
           else
              echo "RECURSIVE = YES" >> Doxyfile
           fi

           # Print these three parameters for verification (CI logs)
           echo "Doxyfile prepared:"
           cat Doxyfile | grep -E "^(INPUT|RECURSIVE|OUTPUT_DIRECTORY)"
        
        # Create documentation
      - name: Create documentation
        run: |
           cd ./docs
           doxygen Doxyfile -Werror
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload entire repository
            path: ./docs/build/html/
            
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
